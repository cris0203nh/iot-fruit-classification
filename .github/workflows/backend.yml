name: AgroScan CI - backend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas FastAPI, SQLite y SaaS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de backend y módulos visuales usados por sus pruebas
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install opencv-contrib-python-headless==4.12.0.88 Pillow==12.3.0
      - name: Preparar SQLite y JWT exclusivamente temporales
        shell: bash
        run: |
          echo "AGROSCAN_DATA_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
          python - <<'PYSECRET'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('AGROSCAN_JWT_SECRET=' + secrets.token_hex(32) + '\n')
          PYSECRET
      - name: Suite backend completa
        env:
          PYTHONPATH: .:backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Pruebas de control del proxy de demostración
        env:
          PYTHONPATH: .:backend
        run: python -m unittest discover -s tests -p 'test_agroscan_demo_deploy.py' -v
