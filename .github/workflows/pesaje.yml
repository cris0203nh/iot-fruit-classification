name: Pesaje ESP32 y pruebas de software
on:
  push:
    paths: ['firmware/agroscan_scale/**', 'firmware/tools/**', 'firmware/weight_simulator.py', 'tests/**', 'backend/**', '.github/workflows/pesaje.yml']
  pull_request:
    paths: ['firmware/agroscan_scale/**', 'firmware/tools/**', 'firmware/weight_simulator.py', 'tests/**', 'backend/**', '.github/workflows/pesaje.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias necesarias para todas las pruebas de tests/
        run: |
          python -m pip install -r backend/requirements.txt
          # Las pruebas I03 usan OpenCV con ArUco; la variante contrib es necesaria.
          python -m pip install opencv-contrib-python-headless==4.12.0.88 Pillow==12.3.0
      - name: Preparar entorno efímero sin datos ni claves reales
        shell: bash
        run: |
          test_dir="$(mktemp -d)"
          printf 'AGROSCAN_DATA_DIR=%s\n' "$test_dir" >> "$GITHUB_ENV"
          python - <<'PYSECRET'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write('AGROSCAN_JWT_SECRET=' + secrets.token_hex(32) + '\n')
          PYSECRET
      - name: Verificar la dependencia ArUco
        run: python -c 'import cv2; assert hasattr(cv2, "aruco"), "OpenCV contrib requiere ArUco"'
      - name: Probar núcleo de pesaje
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_scale_core.cpp -o /tmp/test_scale_core
          /tmp/test_scale_core
      - name: Probar puente, IoT autenticado y geometría
        env:
          PYTHONPATH: backend
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
  compile-esp32:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar plataforma y librería
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'HX711 Arduino Library@0.7.5'
      - name: Compilar simulación
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s firmware/agroscan_scale
      - name: Compilar sensor real
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s --build-property 'compiler.cpp.extra_flags=-DAGROSCAN_SIMULATION=0' firmware/agroscan_scale
