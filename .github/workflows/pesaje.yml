name: AgroScan CI - IoT y pesaje ESP32

on:
  workflow_call:

permissions:
  contents: read

jobs:
  software:
    name: Pruebas de puente e IoT autenticado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias API para las pruebas de IoT
        run: python -m pip install -r backend/requirements.txt
      - name: Preparar datos y JWT efímeros
        shell: bash
        run: |
          echo "AGROSCAN_DATA_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
          python - <<'PYSECRET'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('AGROSCAN_JWT_SECRET=' + secrets.token_hex(32) + '\n')
          PYSECRET
      - name: Probar ScaleCore sin hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_scale_core.cpp -o /tmp/test_scale_core
          /tmp/test_scale_core
      - name: Probar integración IoT SaaS-07
        env:
          PYTHONPATH: .:backend
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_iot_firmware_integration.py' -v
      - name: Probar puente serie
        env:
          PYTHONPATH: .:backend
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_serial_bridge.py' -v
      - name: Probar simulador de pesaje
        env:
          PYTHONPATH: .:backend
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_weight_simulator.py' -v

  compile-esp32:
    name: Compilar ESP32 real y simulado
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar plataforma y librería
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'HX711 Arduino Library@0.7.5'
      - name: Compilar simulación
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s firmware/agroscan_scale
      - name: Compilar sensor real
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s --build-property 'compiler.cpp.extra_flags=-DAGROSCAN_SIMULATION=0' firmware/agroscan_scale
