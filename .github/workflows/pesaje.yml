name: Pesaje ESP32 y pruebas de software
on:
  push:
    paths: ['firmware/agroscan_scale/**', 'firmware/tools/**', 'tests/test_scale_core.cpp', 'tests/test_serial_bridge.py', 'tests/test_weight_simulator.py', 'tests/test_iot_firmware_integration.py', 'firmware/weight_simulator.py', 'backend/**', '.github/workflows/pesaje.yml']
  pull_request:
    paths: ['firmware/agroscan_scale/**', 'firmware/tools/**', 'tests/test_scale_core.cpp', 'tests/test_serial_bridge.py', 'tests/test_weight_simulator.py', 'tests/test_iot_firmware_integration.py', 'firmware/weight_simulator.py', 'backend/**', '.github/workflows/pesaje.yml']
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Instalar dependencias del backend
        run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - name: Probar núcleo de pesaje
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_scale_core.cpp -o /tmp/test_scale_core
          /tmp/test_scale_core
      - name: Generar clave JWT efímera para pruebas de integración
        shell: bash
        run: |
          python - <<'PYSECRET'
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as target:
              target.write('AGROSCAN_JWT_SECRET=' + secrets.token_hex(32) + '\n')
          PYSECRET
      - name: Probar puente serial y HTTP local
        env:
          PYTHONPATH: backend
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
  compile-esp32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2 (Node 20, pendiente de migración upstream)
      - name: Instalar plataforma y librería
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'HX711 Arduino Library@0.7.5'
      - name: Compilar simulación
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s firmware/agroscan_scale
      - name: Compilar sensor real
        run: arduino-cli compile --fqbn esp32:esp32:nodemcu-32s --build-property 'compiler.cpp.extra_flags=-DAGROSCAN_SIMULATION=0' firmware/agroscan_scale
